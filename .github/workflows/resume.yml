# Zegar wznowienia: cron GitHuba spóźnia się o godziny (dozorca wstaje co 2,5-5 h), a limit subskrypcji
# resetuje się co do minuty. Epilog zaparkowanej sesji wywołuje ten workflow; job śpi do `wznow_po`
# i woła launch. Dozorca zostaje siatką bezpieczeństwa (park dłuższy niż limit joba, padnięty zegar).
name: resume
run-name: resume #${{ inputs.issue }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Numer zaparkowanego issue (blocked:rate-limit)
        required: true

concurrency:
  group: resume-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  wait:
    if: vars.AUTOPILOT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 .github/loop/loop.py resume "${{ inputs.issue }}"
