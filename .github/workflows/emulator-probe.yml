name: emulator-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Włącz KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pobierz APK z prywatnego release
        env:
          GH_TOKEN: ${{ secrets.ASSETS_READ_TOKEN }}
        run: gh release download v10.7.5 --repo Kucze3205/blockblast-assets --dir assets --pattern '*.apk'

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: ./tools/emulator_probe.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe-out/
