# Dozorca (#10, #26): zegar spoza łańcucha. Sztywny skrypt, zero agenta — dozorca-sesja mogłaby paść
# na tę samą chorobę, którą leczy. Kopie, zanim zawoła; awarię ogłasza czerwonym przebiegiem
# (przebieg z crona mailuje do autora pliku workflow — jedyny darmowy kanał push).
name: watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watch:
    if: vars.AUTOPILOT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ASSETS_READ_TOKEN: ${{ secrets.ASSETS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 .github/loop/loop.py watch
