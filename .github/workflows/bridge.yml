name: bridge

on:
  workflow_dispatch:
    inputs:
      moves:
        description: Ile ruchów wykonać
        default: "30"
  push:
    branches: [wayfinder/18-bridge]

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Włącz KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Zależności mostu
        run: |
          sudo apt-get install -y -q tesseract-ocr
          pip install pillow numpy

      - name: Pobierz APK z prywatnego release
        env:
          GH_TOKEN: ${{ secrets.ASSETS_READ_TOKEN }}
        run: gh release download v10.7.5 --repo Kucze3205/blockblast-assets --dir assets --pattern '*.apk'

      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MOVES: ${{ inputs.moves || '20' }}
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash tools/bridge.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-out
          path: bridge-out/
