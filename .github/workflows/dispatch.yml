# Jedyne publiczne wejście do pętli: `gh workflow run dispatch.yml -f issue=N`.
# Wywołuje je orchestrator (ścieżka pętli) i etykieta `ready` nadana przez człowieka (#5).
# Cała walidacja, deduplikacja siedzą w loop.py `launch`.
name: dispatch
run-name: dispatch #${{ inputs.issue || github.event.issue.number }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Numer issue z etykietą rola:*
        required: true
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  route:
    if: vars.AUTOPILOT == 'on' && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 .github/loop/loop.py route "${{ inputs.issue || github.event.issue.number }}"
