# Profile ról (#7, #15). Rola = skill (.claude/skills/<rola>/SKILL.md) + profil stąd.
# Etykieta `rola:<nazwa>` wybiera oba. Model i effort domyślne siedzą we frontmatterze
# skilla; nadpisuje je wyłącznie orchestrator etykietami `model:*` / `effort:*`.
#
# Dwa zakazy leżą w workflow, nie tutaj — ten plik orchestrator edytuje sam:
#   1. żaden profil nie ma naraz internetu i zapisu kodu,
#   2. żaden profil nie sięga do .github/, skilla orchestratora ani bench/record.json.
#
# `write` to allowlista ścieżek zapisu (globy). Dziś granica jest społeczna (skill),
# nie mechaniczna; orchestrator może ją uszczelnić (#7).
# `tools` to pełna lista dla --allowedTools: tryb automation nie nadaje uprawnień (#4).

orchestrator:
  internet: false
  emulator: false
  write: ["docs/journal/**", "RAPORT.md", "GOAL_REACHED", ".claude/skills/**", ".claude/profiles.yml", "bench/config.json"]
  tools: ["Read", "Grep", "Glob", "Write", "Edit", "Bash(gh:*)", "Bash(git:*)"]
  max_turns: 150
  timeout_minutes: 120

implementer:
  internet: false
  emulator: false
  write: ["**"]
  tools: ["Read", "Grep", "Glob", "Write", "Edit", "Bash(python:*)", "Bash(pytest:*)", "Bash(git:*)", "Bash(gh release:*)"]
  max_turns: 100
  timeout_minutes: 240

researcher:
  internet: true
  emulator: false
  write: ["docs/research/**"]
  tools: ["Read", "Grep", "Glob", "Write", "Edit", "WebSearch", "WebFetch", "Bash(git:*)"]
  max_turns: 80
  timeout_minutes: 120

verifier:
  internet: false
  emulator: true
  write: ["bridge/runs/**"]
  tools: ["Read", "Grep", "Glob", "Write", "Bash(adb:*)", "Bash(python:*)", "Bash(git:*)"]
  max_turns: 120
  timeout_minutes: 300

# `bench` nie jest sesją agenta: job liczący, bez skilla i bez tools.
bench:
  agent: false
  write: ["bench/*.json", "bench/record.json"]   # jedyny pisarz rekordu (#21); zakaz 2 go nie dotyczy
